[package]
name = "simp-music"
version = "0.0.0"
description = "SimpMusic desktop shell (Vue3 + Tauri + api-enhanced)"
authors = ["slfftz2011"]
edition = "2021"

[lib]
name = "simp_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
